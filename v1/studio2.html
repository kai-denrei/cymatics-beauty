<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0d0f">
<meta name="cb" content="89493e79">
<title>studio2 — cymatics performance view</title>
<style>
  :root{
    --bg:#0d0d0f; --panel:#141418; --panel2:#101013; --line:#26262d;
    --ink:#e8e8ea; --dim:#7a7a83; --faint:#4a4a52;
    --amber:#e0a45e; --teal:#5fb3a3; --hot:#d96b6b;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:13px; line-height:1.5;
    background-image:radial-gradient(1200px 600px at 80% -10%,rgba(95,179,163,.06),transparent 60%),
                     radial-gradient(900px 500px at 0% 110%,rgba(224,164,94,.05),transparent 60%);}

  header{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--line)}
  h1{font-family:var(--serif); font-weight:600; font-size:16px; margin:0; display:inline-flex; align-items:baseline; gap:8px}
  h1 .dot{color:var(--teal)}
  h1 .sub{color:var(--dim); font-family:var(--mono); font-size:11px; font-weight:400}
  header .ctrls{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-left:auto}

  button{font-family:var(--mono); font-size:12px; color:var(--ink); background:var(--panel); border:1px solid var(--line);
    border-radius:5px; padding:5px 10px; cursor:pointer; transition:border-color .15s,color .15s}
  button:hover{border-color:var(--teal)}
  button.primary{border-color:var(--teal); color:var(--teal)}
  button.primary.on{background:var(--teal); color:#06120f}
  label.field{display:inline-flex; align-items:center; gap:5px; color:var(--dim); font-size:11px}
  input[type=number]{width:52px; font-family:var(--mono); font-size:11px; color:var(--ink); background:var(--panel2); border:1px solid var(--line); border-radius:4px; padding:3px 5px}
  input[type=range]{accent-color:var(--amber); width:80px}
  select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 6px;font-family:var(--mono);font-size:11px}
  .pill{border:1px solid var(--line); border-radius:999px; padding:2px 8px; color:var(--amber); font-size:10px}
  .hdr-link{color:var(--teal); text-decoration:none; font-size:11px}
  .hdr-link.dim{color:var(--dim)}

  main{display:grid; grid-template-columns:2fr 1fr; gap:1px; background:var(--line); height:calc(100vh - 49px); overflow:hidden}
  @media (max-width:820px){ main{grid-template-columns:1fr; height:auto} }
  .pane{background:var(--bg)}
  .pane-canvas{padding:14px; display:flex; align-items:center; justify-content:center; overflow:hidden}
  .pane-info{padding:12px 14px; overflow-y:auto}

  /* The 2/3 preview canvas — fills the left pane as a square fitting both dims. */
  canvas#cv{width:auto; height:auto; max-width:100%; max-height:100%; aspect-ratio:1/1;
    display:block; background:#08080a; border:1px solid var(--line); border-radius:8px}

  /* Hidden parser holders — kept in DOM so the existing parsePalette / parseArr
     can still read .value verbatim from studio.html's script body. */
  #code, #arr { display:none !important; }

  .nowbar{font-family:var(--mono); font-size:13px; color:var(--dim); margin-bottom:12px; padding:7px 10px; background:var(--panel2); border:1px solid var(--line); border-radius:6px}
  .nowbar b{color:var(--amber); font-size:16px; font-family:var(--serif)}
  .nowbar .sec{color:var(--teal); font-weight:600}
  .beat{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--faint); margin-left:6px; vertical-align:middle}
  .beat.on{background:var(--hot); box-shadow:0 0 8px var(--hot)}

  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px}
  .cell{background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:5px 7px}
  .cell .k{color:var(--dim); font-size:9px; text-transform:uppercase; letter-spacing:.5px}
  .cell .v{font-size:15px; font-family:var(--serif); margin-top:1px}
  .cell .v.amber{color:var(--amber)} .cell .v.teal{color:var(--teal)}

  .label-mini{font-family:var(--serif); font-size:11px; color:var(--dim); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.7px}
  .label-mini:first-of-type{margin-top:8px}

  /* Palette display ---------------------------------------------------- */
  .pal-display{background:var(--panel2); border:1px solid var(--line); border-radius:5px; padding:6px 8px; max-height:240px; overflow-y:auto}
  .pal-line{font-family:var(--mono); font-size:10px; line-height:1.65; white-space:nowrap; overflow-x:auto}
  .pal-inst{color:var(--dim); display:inline-block; width:46px}
  .pal-toks{color:var(--ink)}
  .pal-tok{display:inline-block; padding:0 3px; margin:0 1px; border-radius:2px;
    transition:background-color .08s, color .08s}
  .pal-tok.rest{color:var(--faint)}
  .pal-tok.playing{background:var(--teal); color:#06120f; font-weight:600}

  /* Arrangement display ------------------------------------------------ */
  .arr-display{background:var(--panel2); border:1px solid var(--line); border-radius:5px; padding:6px 6px; max-height:280px; overflow-y:auto}
  .arr-line{font-family:var(--mono); font-size:10px; line-height:1.6; padding:1px 6px; margin:1px 0; border-radius:3px;
    transition:background-color .12s, color .12s}
  .arr-bar{color:var(--faint); display:inline-block; width:24px; text-align:right; margin-right:8px}
  .arr-cmd{color:var(--amber); margin-right:6px}
  .arr-args{color:var(--dim)}
  .arr-line.section .arr-cmd{color:var(--teal)}
  .arr-line.playing{background:rgba(95,179,163,0.12)}
  .arr-line.playing .arr-bar{color:var(--teal)}
  .arr-line.section.playing{background:rgba(95,179,163,0.30)}
  .arr-line.section.playing .arr-cmd{font-weight:700}
  .arr-line.section.playing .arr-args{color:var(--ink)}
  .arr-meta{color:var(--faint); font-family:var(--mono); font-size:10px; padding:3px 6px}

  .meters{display:grid; gap:4px; margin-top:12px}
  .meter{display:grid; grid-template-columns:48px 1fr; align-items:center; gap:6px; font-size:9px; color:var(--dim)}
  .track{height:5px; background:var(--panel2); border:1px solid var(--line); border-radius:3px; overflow:hidden}
  .fill{height:100%; width:0%; background:var(--teal); transition:width .05s linear}
  .fill.bass{background:var(--amber)} .fill.tre{background:var(--hot)}

  /* Braille seek slider. Variable mapping for the shared component: it expects
     --rule / --ink-dim / --tap-min; studio2 uses --line / --dim and a compact
     28px tap target (the index.html sliders are 36px because they live in a
     touch-first iconbar; here the row is tighter). */
  .seek-row{margin:0 0 12px}
  .bsl{display:grid; grid-template-columns:30px 1fr 30px; gap:3px; min-width:0}
  .bsl-step{background:transparent; border:1px solid var(--line); color:var(--dim);
    font-family:var(--mono); font-size:13px; font-weight:700; line-height:1;
    min-height:28px; min-width:28px; padding:0; cursor:pointer; border-radius:2px;
    transition:border-color 120ms ease, color 120ms ease, background 120ms ease;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
    display:flex; align-items:center; justify-content:center}
  .bsl-step:hover,.bsl-step:active,.bsl-step-active{
    border-color:var(--amber); color:var(--amber); background:rgba(224,164,94,0.10)}
  .bsl-step-labeled{flex-direction:column; align-items:flex-start; justify-content:space-between; padding:3px 5px}
  .bsl-step-labeled .bsl-label{font-size:9px; font-weight:500; letter-spacing:0.04em; color:var(--amber); line-height:1}
  .bsl-step-labeled .bsl-arrow{font-size:13px; line-height:1; align-self:center}
  .bsl-bar{display:flex; align-items:center; justify-content:center; letter-spacing:0;
    font-family:var(--mono); font-size:15px; line-height:1; min-height:28px;
    border:1px solid var(--line); border-radius:2px; cursor:pointer;
    user-select:none; -webkit-user-select:none; touch-action:none; outline:none;
    background:rgba(0,0,0,0.30); overflow:hidden; min-width:0}
  .bsl-bar:focus-visible{border-color:var(--teal)}
  .bsl-bar span{display:inline-block; padding:0}

  /* Headless mode parity with studio.html. studio2 isn't currently embedded
     anywhere — kept defensively so a future ?headless=1 usage doesn't break. */
  body.headless { background:transparent; }
  body.headless > header,
  body.headless > main { display:none !important; }
</style>

<header>
  <h1>studio2<span class="dot">.</span> <span class="sub">performance view</span></h1>
  <div class="ctrls">
    <button id="play" class="primary">▶ play</button>
    <label class="field">preset
      <select id="preset"></select>
    </label>
    <label class="field">bpm <input id="bpm" type="number" value="138" min="60" max="200"></label>
    <label class="field">vol <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    <span class="pill">ch: <span id="chname">cymatics</span></span>
    <!-- ↗ field reuses the same back-link semantics as studio.html: same-tab
         navigation so we don't spawn a second cymatics page with its own
         hidden iframe-engine (dual-broadcaster pathology — see pm.md). -->
    <a id="field-link" href="./" rel="noopener" class="hdr-link">↗ field</a>
    <a href="./studio.html" rel="noopener" class="hdr-link dim">↗ editor</a>
  </div>
</header>

<main>
  <section class="pane pane-canvas">
    <canvas id="cv" width="900" height="900"></canvas>
  </section>

  <section class="pane pane-info">
    <div class="nowbar">
      bar <b id="curbar">0</b>/<span id="len">64</span>
      · <span class="sec" id="cursec">—</span>
      <span id="beatdot" class="beat"></span>
    </div>

    <!-- Braille seek slider. min/max are seeded at 0/63 (matches all current
         presets' @length 64). The format callback below reads the live `arr`
         so a preset with a different length still labels correctly. -->
    <div id="seek-mount" class="seek-row"></div>

    <div class="grid">
      <div class="cell"><div class="k">M</div><div class="v amber" id="rM">–</div></div>
      <div class="cell"><div class="k">N</div><div class="v amber" id="rN">–</div></div>
      <div class="cell"><div class="k">J</div><div class="v teal" id="rJ">–</div></div>
      <div class="cell"><div class="k">S</div><div class="v teal" id="rS">–</div></div>
    </div>

    <p class="label-mini">palette · playhead in teal</p>
    <div id="palDisp" class="pal-display"></div>

    <p class="label-mini">arrangement · active section</p>
    <div id="arrDisp" class="arr-display"></div>

    <div class="meters">
      <div class="meter"><span>rms</span><div class="track"><div class="fill" id="mRms"></div></div></div>
      <div class="meter"><span>bass</span><div class="track"><div class="fill bass" id="mBass"></div></div></div>
      <div class="meter"><span>mid</span><div class="track"><div class="fill" id="mMid"></div></div></div>
      <div class="meter"><span>treble</span><div class="track"><div class="fill tre" id="mTre"></div></div></div>
      <div class="meter"><span>centroid</span><div class="track"><div class="fill" id="mCen"></div></div></div>
    </div>
  </section>
</main>

<!-- Parser-only data holders. studio.html's parsePalette/parseArr read these
     by id; the user never sees the raw text in studio2 (the rendered palette
     + arrangement panes above are the canonical display). -->
<textarea id="code"></textarea>
<textarea id="arr"></textarea>

<script type="module">
/* =====================================================================
   cymatics studio2 — same engine + audio + scheduler as studio.html,
   different presentation: 2/3 canvas + read-only rendered palette /
   arrangement with playhead highlighting. Script body is a near-verbatim
   copy of studio.html — minimal surface area, no shared-module refactor
   (studio.html is the "fix is shipped, don't touch" branch per pm.md).
   ===================================================================== */
import { BrailleSlider } from './src/braille-slider.js';
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- notes & tokens ------------------------------------------- */
const SEMI={c:0,d:2,e:4,f:5,g:7,a:9,b:11};
function noteToFreq(s){
  const m=/^([a-gA-G])([#sb]?)(-?\d+)$/.exec(s.trim()); if(!m) return null;
  let semi=SEMI[m[1].toLowerCase()];
  if(m[2]==='#'||m[2]==='s')semi++; else if(m[2]==='b')semi--;
  return 440*Math.pow(2,(12*(parseInt(m[3],10)+1)+semi-69)/12);
}
function parseTokens(str){
  let div=1, rest=str.trim();
  const dm=/\/(\d+)\s*$/.exec(rest); if(dm){ div=parseInt(dm[1],10)||1; rest=rest.slice(0,dm.index).trim(); }
  return {tokens:rest.split(/\s+/).filter(Boolean), div};
}
function euclid(k,n){ const out=[]; let acc=0; for(let i=0;i<n;i++){ acc+=k; if(acc>=n){acc-=n; out.push('x');} else out.push('~'); } return out; }

function parsePalette(text){
  const lines=[];
  text.split('\n').forEach((ln,i)=>{
    let s=ln.trim(); if(!s||s.startsWith('#')||s.startsWith('//')) return;
    const ci=s.indexOf(':'); if(ci<0) throw new Error(`palette line ${i+1}: missing ':'`);
    const inst=s.slice(0,ci).trim().toLowerCase();
    const {tokens,div}=parseTokens(s.slice(ci+1));
    if(!tokens.length) throw new Error(`palette line ${i+1}: empty`);
    lines.push({inst,tokens,div});
  });
  return lines;
}
function parseArr(text){
  const cues=[]; let length=64;
  text.split('\n').forEach((ln,i)=>{
    let s=ln.trim(); if(!s||s.startsWith('#')||s.startsWith('//')) return;
    s=s.split(';')[0].trim(); if(!s) return;
    if(s[0]==='@'){ const p=s.slice(1).split(/\s+/); if(p[0]==='length') length=parseInt(p[1],10)||64; return; }
    const m=/^(\d+)\s+([a-zA-Z]+)\s*(.*)$/.exec(s);
    if(!m) throw new Error(`arr line ${i+1}: ${ln}`);
    cues.push({at:+m[1], cmd:m[2].toLowerCase(), args:m[3].split(/\s+/).filter(Boolean), raw:m[3]});
  });
  cues.sort((a,b)=>a.at-b.at);
  return {length,cues};
}

/* =====================================================================
   AUDIO ENGINE  (identical to studio.html)
   ===================================================================== */
let ac,master,masterFilter,analyser,reverbBus,delayBus,timeBuf,freqBuf,noiseBuf;
const SENDS={ chord:{r:.5,d:.3}, lead:{r:.4,d:.45}, arp:{r:0,d:.5}, snare:{r:.25,d:0}, clap:{r:.25,d:0} };

function buildAudio(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain(); master.gain.value=parseFloat($('vol').value);
  masterFilter=ac.createBiquadFilter(); masterFilter.type='lowpass'; masterFilter.frequency.value=20000; masterFilter.Q.value=0.7;
  analyser=ac.createAnalyser(); analyser.fftSize=2048; analyser.smoothingTimeConstant=0.6;
  master.connect(masterFilter); masterFilter.connect(analyser); analyser.connect(ac.destination);
  timeBuf=new Uint8Array(analyser.fftSize); freqBuf=new Uint8Array(analyser.frequencyBinCount);

  reverbBus=ac.createGain(); const conv=ac.createConvolver(); conv.buffer=makeIR(2.4,2.6);
  const rwet=ac.createGain(); rwet.gain.value=0.34; reverbBus.connect(conv); conv.connect(rwet); rwet.connect(master);

  delayBus=ac.createGain(); const dly=ac.createDelay(1.0); dly.delayTime.value=60/bpm()*0.75;
  const fb=ac.createGain(); fb.gain.value=0.36; const dlp=ac.createBiquadFilter(); dlp.type='lowpass'; dlp.frequency.value=2600;
  const dwet=ac.createGain(); dwet.gain.value=0.5;
  delayBus.connect(dly); dly.connect(dlp); dlp.connect(fb); fb.connect(dly); dlp.connect(dwet); dwet.connect(master);
  ac._dly=dly;

  const n=ac.sampleRate; noiseBuf=ac.createBuffer(1,n,ac.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
}
function makeIR(dur,decay){ const len=ac.sampleRate*dur, b=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){ const ch=b.getChannelData(c); for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);} return b; }
function noiseSrc(){ const s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s; }

function vKick(out,t){
  const o=ac.createOscillator(),g=ac.createGain(); o.type='sine';
  o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(48,t+0.1);
  g.gain.setValueAtTime(1,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
  o.connect(g); g.connect(out);
  const cs=noiseSrc(),cg=ac.createGain(),hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=3000;
  cg.gain.setValueAtTime(0.5,t); cg.gain.exponentialRampToValueAtTime(0.0001,t+0.02);
  cs.connect(hp); hp.connect(cg); cg.connect(out);
  o.start(t); o.stop(t+0.32); cs.start(t); cs.stop(t+0.03);
}
function vHat(out,t,open){ const s=noiseSrc(),hp=ac.createBiquadFilter(),g=ac.createGain();
  hp.type='highpass'; hp.frequency.value=7800; const dec=open?0.26:0.045;
  g.gain.setValueAtTime(open?0.5:0.42,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dec);
  s.connect(hp); hp.connect(g); g.connect(out); s.start(t); s.stop(t+dec+0.02); }
function vSnare(out,t){ const s=noiseSrc(),bp=ac.createBiquadFilter(),g=ac.createGain();
  bp.type='bandpass'; bp.frequency.value=1900; bp.Q.value=0.7;
  g.gain.setValueAtTime(0.7,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
  s.connect(bp); bp.connect(g); g.connect(out);
  const o=ac.createOscillator(),og=ac.createGain(); o.type='triangle'; o.frequency.setValueAtTime(190,t);
  og.gain.setValueAtTime(0.4,t); og.gain.exponentialRampToValueAtTime(0.0001,t+0.09); o.connect(og); og.connect(out);
  s.start(t); s.stop(t+0.2); o.start(t); o.stop(t+0.1); }
function vClap(out,t){ for(let k=0;k<3;k++){ const s=noiseSrc(),bp=ac.createBiquadFilter(),g=ac.createGain();
  bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=1; const tt=t+k*0.012;
  g.gain.setValueAtTime(0.5,tt); g.gain.exponentialRampToValueAtTime(0.0001,tt+0.1);
  s.connect(bp); bp.connect(g); g.connect(out); s.start(tt); s.stop(tt+0.12);} }
function vBass(out,t,freqs,dur){ const f=freqs[0]; if(!f) return;
  const lp=ac.createBiquadFilter(),g=ac.createGain(); lp.type='lowpass'; lp.Q.value=8;
  lp.frequency.setValueAtTime(220,t); lp.frequency.exponentialRampToValueAtTime(900,t+0.02);
  lp.frequency.exponentialRampToValueAtTime(180,t+Math.min(dur,0.25));
  [0,-7].forEach(ct=>{ const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.detune.value=ct; o.connect(lp); o.start(t); o.stop(t+dur);});
  const sub=ac.createOscillator(); sub.type='sine'; sub.frequency.value=f/2; sub.connect(lp); sub.start(t); sub.stop(t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.6,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(dur,0.08));
  lp.connect(g); g.connect(out); }
function vSuper(out,t,freqs,dur,bright){ const lp=ac.createBiquadFilter(),g=ac.createGain();
  lp.type='lowpass'; lp.Q.value=0.8; lp.frequency.value=bright?4200:2400; const N=7,spread=18;
  freqs.forEach(f=>{ for(let i=0;i<N;i++){ const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
    o.detune.value=(i-(N-1)/2)*spread/((N-1)/2); const vg=ac.createGain(); vg.gain.value=1/Math.sqrt(N*freqs.length);
    o.connect(vg); vg.connect(lp); o.start(t); o.stop(t+dur+0.4);} });
  const atk=0.04,rel=Math.min(0.5,dur*0.6);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+atk);
  g.gain.setValueAtTime(0.5,t+Math.max(atk,dur-rel)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  lp.connect(g); g.connect(out); }
function vPluck(out,t,freqs,dur){ freqs.forEach(f=>{ const o=ac.createOscillator(),lp=ac.createBiquadFilter(),g=ac.createGain();
  o.type='square'; o.frequency.value=f; lp.type='lowpass'; lp.Q.value=4;
  lp.frequency.setValueAtTime(5000,t); lp.frequency.exponentialRampToValueAtTime(700,t+0.18);
  const d=Math.min(dur,0.22); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.32,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(lp); lp.connect(g); g.connect(out); o.start(t); o.stop(t+d+0.02);} ); }

function launchRiser(t,dur){
  const o=ac.createOscillator(),bp=ac.createBiquadFilter(),g=ac.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(1760,t+dur);
  bp.type='bandpass'; bp.Q.value=4; bp.frequency.setValueAtTime(400,t); bp.frequency.exponentialRampToValueAtTime(8000,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+dur); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.05);
  o.connect(bp); bp.connect(g); g.connect(master); g.connect(delayBus); o.start(t); o.stop(t+dur+0.1);
}

function trigger(tr,tok,t,dur){
  const out=tr.bus, inst=tr.inst;
  if(inst==='kick') return vKick(out,t);
  if(inst==='chh')  return vHat(out,t,false);
  if(inst==='ohh')  return vHat(out,t,true);
  if(inst==='snare')return vSnare(out,t);
  if(inst==='clap') return vClap(out,t);
  let freqs=tok.split('+').map(noteToFreq).filter(f=>f!=null); if(!freqs.length) return;
  if(tr.transpose) freqs=freqs.map(f=>f*Math.pow(2,tr.transpose/12));
  if(inst==='bass') return vBass(out,t,freqs,dur);
  if(inst==='chord')return vSuper(out,t,freqs,dur,false);
  if(inst==='lead') return vSuper(out,t,freqs,dur,true);
  return vPluck(out,t,freqs,dur);
}

let tracks=[], trackMap=new Map();
function buildTracks(palette){
  tracks=[]; trackMap=new Map();
  for(const p of palette){
    const bus=ac.createGain(); bus.gain.value=arrangeOn?0.0001:1; bus.connect(master);
    const def=SENDS[p.inst]||{r:0,d:0};
    const sR=ac.createGain(); sR.gain.value=def.r; bus.connect(sR); sR.connect(reverbBus);
    const sD=ac.createGain(); sD.gain.value=def.d; bus.connect(sD); sD.connect(delayBus);
    const tr={name:p.inst, inst:p.inst, tokens:p.tokens.slice(), div:p.div, transpose:0, bus, sR, sD,
              base:{tokens:p.tokens.slice(), div:p.div, r:def.r, d:def.d}};
    tracks.push(tr); trackMap.set(tr.name,tr);
  }
  paletteDirty = true;   // rebuild display from fresh tracks
}

/* =====================================================================
   TRANSPORT + ARRANGEMENT
   ===================================================================== */
let playing=false, stepIndex=0, nextTime=0, timer=null;
let arrangeOn=true, arr=null, curBar=0, curSection='—';
const LOOKAHEAD=0.1, TICK=25;
const bpm=()=>parseFloat($('bpm').value);
const stepDur=()=>(60/bpm())/4;
const barDur=()=>16*stepDur();

function rampParam(p,target,time,bars){ p.cancelScheduledValues(time); p.setValueAtTime(p.value,time);
  if(bars<=0) p.setTargetAtTime(target,time,0.05); else p.linearRampToValueAtTime(target,time+bars*barDur()); }

function resetArrangement(time){
  for(const tr of tracks){ tr.tokens=tr.base.tokens.slice(); tr.div=tr.base.div; tr.transpose=0;
    tr.bus.gain.cancelScheduledValues(time); tr.bus.gain.setValueAtTime(0.0001,time);
    tr.sR.gain.setValueAtTime(tr.base.r,time); tr.sD.gain.setValueAtTime(tr.base.d,time); }
  masterFilter.frequency.cancelScheduledValues(time); masterFilter.frequency.setValueAtTime(20000,time);
  paletteDirty = true;
}
function applyCue(c,time){
  const a=c.args, tr=trackMap.get(a[0]), F=0.25;
  switch(c.cmd){
    case 'in':   if(tr) tr.bus.gain.setTargetAtTime(1,time,F); break;
    case 'out':  if(tr) tr.bus.gain.setTargetAtTime(0.0001,time,F); break;
    case 'gain': if(tr) rampParam(tr.bus.gain, clamp(+a[1],0,1), time, +a[2]||0); break;
    case 'transpose': if(tr) tr.transpose=+a[1]||0; break;
    case 'clone':{ const s=trackMap.get(a[0]), d=trackMap.get(a[1]);
      if(s&&d){ d.tokens=s.tokens.slice(); d.div=s.div; d.transpose=(s.transpose||0)+(+a[2]||0); paletteDirty=true; } break; }
    case 'set':  if(tr){ const r=parseTokens(a.slice(1).join(' ')); tr.tokens=r.tokens; tr.div=r.div; paletteDirty=true; } break;
    case 'euclid': if(tr){ tr.tokens=euclid(+a[1],+a[2]); tr.div=1; paletteDirty=true; } break;
    case 'fx':   if(tr){ const g=(a[1]==='reverb')?tr.sR:tr.sD; g.gain.setTargetAtTime(+a[2]||0,time,0.1);} break;
    case 'filter': rampParam(masterFilter.frequency, +a[0]||20000, time, +a[1]||0); break;
    case 'riser': launchRiser(time, (+a[0]||4)*barDur()); break;
    case 'section': curSection=c.raw||a.join(' '); break;
  }
}
function handleBar(bar,time){
  if(!arr) return; const L=arr.length, local=((bar%L)+L)%L;
  if(bar>0 && local===0) resetArrangement(time);
  for(const c of arr.cues) if(c.at===local) applyCue(c,time);
  curBar=local;
}
function scheduler(){
  while(nextTime < ac.currentTime+LOOKAHEAD){
    const sd=stepDur();
    if(stepIndex%16===0 && arrangeOn) handleBar(stepIndex/16|0, nextTime);
    for(const tr of tracks){ const total=tr.tokens.length*tr.div, local=stepIndex%total;
      if(local%tr.div===0){ const tok=tr.tokens[local/tr.div]; if(tok&&tok!=='~') trigger(tr,tok,nextTime,tr.div*sd*0.96); } }
    nextTime+=sd; stepIndex++;
  }
}
function startTransport(){
  if(!ac) buildAudio();
  buildTracks(currentPalette);
  if(ac.state==='suspended') ac.resume();
  playing=true; stepIndex=0; nextTime=ac.currentTime+0.08;
  // Pending seek (user dragged the bar slider before ▶): fast-forward the
  // arrangement state into bar N before the scheduler fires its first tick.
  if (seekPending) { doSeek(pendingSeekBar); seekPending = false; }
  timer=setInterval(scheduler,TICK); requestAnimationFrame(loop);
}
function stopTransport(){ playing=false; clearInterval(timer); timer=null; }

/* ---------- seek to bar N -------------------------------------------- *
 * The bar slider drags the transport forward/backward. Cues are not pure
 * state-setters (they call setTargetAtTime ramps with non-zero time
 * constants), so we can't replay them naively with their original times —
 * gain ramps wouldn't have time to settle. applyCueInstant mirrors applyCue
 * but uses setValueAtTime everywhere (instant value snap, no exponential
 * smoothing) and skips `riser` (it injects an audio source — replaying
 * during seek would inject extra risers).
 *
 * Cues at bars 0..(targetBar-1) are pre-applied; cues AT targetBar fire
 * naturally on the next scheduler tick when stepIndex%16===0.
 */
let seekPending = false, pendingSeekBar = 0;
// Forward-declared so the initial loadPreset() can call seekSlider.setValue
// without a TDZ error. Assigned for real after the first loadPreset returns,
// once `arr` exists for the format callback.
let seekSlider = null;

function seekTo(bar) {
  if (!arr) return;
  bar = Math.max(0, Math.min(arr.length - 1, bar | 0));
  if (playing && ac) {
    doSeek(bar);
  } else {
    // Pre-play seek: stash target. startTransport will apply it after
    // building tracks + before the scheduler starts.
    pendingSeekBar = bar;
    seekPending = true;
    curBar = bar;
    $('curbar').textContent = bar;
  }
}

function doSeek(bar) {
  const t = ac.currentTime;
  resetArrangement(t);
  for (const c of arr.cues) {
    if (c.at >= bar) break;   // arr.cues is sorted by .at
    applyCueInstant(c, t);
  }
  stepIndex = bar * 16;
  nextTime = t + 0.05;
  curBar = bar;
  paletteDirty = true;   // tokens may have changed via set/clone/euclid
}

function applyCueInstant(c, time) {
  const a = c.args, tr = trackMap.get(a[0]);
  switch (c.cmd) {
    case 'in':   if(tr){ tr.bus.gain.cancelScheduledValues(time); tr.bus.gain.setValueAtTime(1, time); } break;
    case 'out':  if(tr){ tr.bus.gain.cancelScheduledValues(time); tr.bus.gain.setValueAtTime(0.0001, time); } break;
    case 'gain': if(tr){ tr.bus.gain.cancelScheduledValues(time); tr.bus.gain.setValueAtTime(clamp(+a[1],0,1), time); } break;
    case 'transpose': if(tr) tr.transpose = +a[1] || 0; break;
    case 'clone': { const s=trackMap.get(a[0]), d=trackMap.get(a[1]);
      if(s&&d){ d.tokens=s.tokens.slice(); d.div=s.div; d.transpose=(s.transpose||0)+(+a[2]||0); } break; }
    case 'set':  if(tr){ const r=parseTokens(a.slice(1).join(' ')); tr.tokens=r.tokens; tr.div=r.div; } break;
    case 'euclid': if(tr){ tr.tokens=euclid(+a[1],+a[2]); tr.div=1; } break;
    case 'fx':   if(tr){ const g=(a[1]==='reverb')?tr.sR:tr.sD; g.gain.cancelScheduledValues(time); g.gain.setValueAtTime(+a[2]||0, time); } break;
    case 'filter': masterFilter.frequency.cancelScheduledValues(time); masterFilter.frequency.setValueAtTime(+a[0]||20000, time); break;
    case 'riser': /* skip — injecting an audio source during seek is wrong */ break;
    case 'section': curSection = c.raw || a.join(' '); break;
  }
}

const CHAN=new URLSearchParams(location.search).get('chan')||'cymatics';
$('chname').textContent=CHAN;
const chan=new BroadcastChannel(CHAN);
const controlChan=new BroadcastChannel(CHAN+'-control');
const HEADLESS = new URLSearchParams(location.search).get('headless') === '1';
if (HEADLESS) document.body.classList.add('headless');
{

  if(fl){ const q=location.search; if(q) fl.href='./'+q; }

let avgBass=0, beatHold=0, beatCount=0, Mf=5, Nf=3, jit=0.18;
const field={M:5,N:3,J:0.18,S:0.8};

function analyze(){
  analyser.getByteTimeDomainData(timeBuf); analyser.getByteFrequencyData(freqBuf);
  let sum=0; for(let i=0;i<timeBuf.length;i++){ const v=(timeBuf[i]-128)/128; sum+=v*v; }
  const rms=Math.sqrt(sum/timeBuf.length);
  const binHz=ac.sampleRate/analyser.fftSize, bins=freqBuf.length;
  let bass=0,bn=0,mid=0,mn=0,tre=0,tn=0,cw=0,cs=0;
  for(let i=1;i<bins;i++){ const f=i*binHz,m=freqBuf[i]/255;
    if(f<200){bass+=m;bn++;} else if(f<2000){mid+=m;mn++;} else if(f<12000){tre+=m;tn++;} cw+=f*m; cs+=m; }
  bass=bn?bass/bn:0; mid=mn?mid/mn:0; tre=tn?tre/tn:0;
  const cen01=clamp(Math.log2(((cs?cw/cs:40))/40)/Math.log2(12000/40),0,1);
  avgBass=lerp(avgBass,bass,0.08); let beat=false;
  if(bass>avgBass*1.45 && bass>0.18 && beatHold<=0){ beat=true; beatHold=8; beatCount++; }
  if(beatHold>0) beatHold--;
  return {rms,bass,mid,tre,cen01,beat};
}
function mapToField(ft){
  if(ft.beat){ Mf=2+ft.cen01*9.5; Nf=2+clamp(ft.bass*1.4,0,1)*9.5; }
  let M=clamp(Math.round(Mf),1,12), N=clamp(Math.round(Nf),1,12);
  if(M===N) N=N<12?N+1:N-1;
  if(ft.beat) jit=0.85; jit=lerp(jit,0.14,0.06);
  const S=clamp(0.3+ft.rms*4.2,0.1,3);
  const reseed=ft.beat && (beatCount%4===0);
  return {M,N,J:clamp(jit,0,1),S,reseed};
}
let currentTrackLabel = '';
function broadcast(m,ft){ chan.postMessage({ type:'cymatics', t:performance.now(),
  track:currentTrackLabel,
  M:m.M,N:m.N,J:+m.J.toFixed(3),S:+m.S.toFixed(3), beat:ft.beat, reseed:m.reseed,
  rms:+ft.rms.toFixed(3), bass:+ft.bass.toFixed(3), mid:+ft.mid.toFixed(3),
  treble:+ft.tre.toFixed(3), centroid:+ft.cen01.toFixed(3) }); }

/* ---------- preview field (same equation as studio.html) ------------- */
const cv=$('cv'),cx=cv.getContext('2d'); const NP=12000, px=new Float32Array(NP), py=new Float32Array(NP);
for(let i=0;i<NP;i++){ px[i]=Math.random(); py[i]=Math.random(); }
function reseedParticles(){ for(let i=0;i<NP;i++){ px[i]=Math.random(); py[i]=Math.random(); } }
function fAbs(x,y,M,N){ return Math.abs(Math.cos(N*Math.PI*x)*Math.cos(M*Math.PI*y)-Math.cos(M*Math.PI*x)*Math.cos(N*Math.PI*y)); }
function stepParticles(M,N,J,S){ const eps=0.004,k=0.0016*S;
  for(let i=0;i<NP;i++){ let x=px[i],y=py[i]; const c=fAbs(x,y,M,N);
    const gx=(fAbs(x+eps,y,M,N)-c)/eps, gy=(fAbs(x,y+eps,M,N)-c)/eps;
    x-=k*gx+(Math.random()-0.5)*J*0.02; y-=k*gy+(Math.random()-0.5)*J*0.02;
    if(x<0)x=-x; else if(x>1)x=2-x; if(y<0)y=-y; else if(y>1)y=2-y; px[i]=x; py[i]=y; } }
function drawParticles(){ const W=cv.width,H=cv.height;
  cx.fillStyle='rgba(8,8,10,0.30)'; cx.fillRect(0,0,W,H);
  cx.fillStyle='rgba(95,179,163,0.55)'; for(let i=0;i<NP;i++) cx.fillRect(px[i]*W,py[i]*H,1.4,1.4); }

/* =====================================================================
   STUDIO2 — palette + arrangement display with playhead highlighting
   ===================================================================== */
const palDisp = $('palDisp'), arrDisp = $('arrDisp');
let paletteEls = [];   // [{name, tokenEls:[span,...], divRef:()=>div, lenRef:()=>len}]
let arrEls = [];       // [{cue, el}]
let paletteDirty = true;
let arrDirty = true;

// Build palette DOM. Reads from live `tracks` once they exist (so set/clone/
// euclid runtime mutations are reflected), else from the static currentPalette
// (pre-startTransport).
function buildPaletteDisplay() {
  palDisp.innerHTML = '';
  paletteEls = [];
  const src = tracks.length ? tracks.map(t => ({inst:t.name, tokens:t.tokens, div:t.div, _track:t}))
                            : currentPalette.map(p => ({inst:p.inst, tokens:p.tokens, div:p.div, _track:null}));
  for (const row of src) {
    const line = document.createElement('div'); line.className = 'pal-line';
    const inst = document.createElement('span'); inst.className = 'pal-inst'; inst.textContent = row.inst + ':';
    line.appendChild(inst);
    const toks = document.createElement('span'); toks.className = 'pal-toks';
    const tokenEls = [];
    row.tokens.forEach(t => {
      const s = document.createElement('span');
      s.className = 'pal-tok' + (t === '~' ? ' rest' : '');
      s.textContent = t;
      tokenEls.push(s);
      toks.appendChild(s);
    });
    line.appendChild(toks);
    palDisp.appendChild(line);
    paletteEls.push({ name: row.inst, tokenEls, track: row._track, staticDiv: row.div, staticLen: row.tokens.length });
  }
  paletteDirty = false;
}

// Highlight the currently-active token per row. The active token for a track
// is floor((stepIndex mod (len*div)) / div). When not playing, clear all.
let lastPlayheadKey = '';
function updatePalettePlayhead() {
  if (paletteDirty) buildPaletteDisplay();
  const active = playing;
  // Build a key so we only mutate DOM when the playhead position actually
  // moves. Per-frame innerHTML thrash would be wasteful with 100+ spans.
  let key = active ? String(stepIndex) : 'idle';
  if (key === lastPlayheadKey) return;
  lastPlayheadKey = key;

  for (const e of paletteEls) {
    const tr = e.track;
    const len = tr ? tr.tokens.length : e.staticLen;
    const dv  = tr ? tr.div          : e.staticDiv;
    // If runtime token count diverged from the DOM (set/euclid changed len),
    // the display is stale; mark dirty so next frame rebuilds. (Cheap O(N)
    // check, just len mismatch.)
    if (tr && tr.tokens.length !== e.tokenEls.length) { paletteDirty = true; return; }
    const total = len * dv;
    const local = active ? (stepIndex % total) : -1;
    const cur = (local >= 0) ? Math.floor(local / dv) : -1;
    for (let i = 0; i < e.tokenEls.length; i++) {
      const should = (i === cur);
      const has = e.tokenEls[i].classList.contains('playing');
      if (should !== has) e.tokenEls[i].classList.toggle('playing', should);
    }
  }
}

function buildArrangementDisplay() {
  arrDisp.innerHTML = '';
  arrEls = [];
  if (!arr) { arrDirty = false; return; }
  for (const c of arr.cues) {
    const line = document.createElement('div');
    line.className = 'arr-line' + (c.cmd === 'section' ? ' section' : '');
    const bar = document.createElement('span'); bar.className = 'arr-bar';
    bar.textContent = String(c.at);
    const cmd = document.createElement('span'); cmd.className = 'arr-cmd';
    cmd.textContent = c.cmd;
    const args = document.createElement('span'); args.className = 'arr-args';
    args.textContent = c.raw || c.args.join(' ');
    line.appendChild(bar); line.appendChild(cmd); line.appendChild(args);
    arrDisp.appendChild(line);
    arrEls.push({ cue: c, el: line });
  }
  const meta = document.createElement('div'); meta.className = 'arr-meta';
  meta.textContent = `@length ${arr.length}`;
  arrDisp.appendChild(meta);
  arrDirty = false;
}

// Highlight the active section = the latest cue with cmd==='section' and at<=curBar.
// All cues whose `at` falls in [activeSecAt, nextSecAt) get the playing tint;
// the section header row gets the stronger background.
let lastSecKey = '';
function updateArrPlayhead() {
  if (arrDirty) buildArrangementDisplay();
  const active = playing && arrangeOn;
  let activeSecAt = -1, nextSecAt = Infinity;
  if (active) {
    for (const e of arrEls) {
      if (e.cue.cmd === 'section' && e.cue.at <= curBar) activeSecAt = Math.max(activeSecAt, e.cue.at);
    }
    for (const e of arrEls) {
      if (e.cue.cmd === 'section' && e.cue.at > activeSecAt) nextSecAt = Math.min(nextSecAt, e.cue.at);
    }
  }
  const key = active ? `${activeSecAt}-${nextSecAt}` : 'idle';
  if (key === lastSecKey) return;
  lastSecKey = key;
  for (const e of arrEls) {
    const inSec = active && e.cue.at >= activeSecAt && e.cue.at < nextSecAt;
    if (inSec !== e.el.classList.contains('playing')) {
      e.el.classList.toggle('playing', inSec);
    }
  }
}

/* ---------- main loop ------------------------------------------------ */
function loop(){
  if(!playing) {
    // Final paint on stop so spans clear back to neutral.
    updatePalettePlayhead(); updateArrPlayhead();
    return;
  }
  const ft=analyze(), m=mapToField(ft);
  field.M=m.M; field.N=m.N; field.J=m.J; field.S=m.S;
  if(m.reseed) reseedParticles(); broadcast(m,ft);
  if (!HEADLESS) { stepParticles(field.M,field.N,field.J,field.S); drawParticles(); }
  $('rM').textContent=field.M; $('rN').textContent=field.N;
  $('rJ').textContent=field.J.toFixed(2); $('rS').textContent=field.S.toFixed(2);
  $('mRms').style.width=clamp(ft.rms*180,0,100)+'%'; $('mBass').style.width=clamp(ft.bass*120,0,100)+'%';
  $('mMid').style.width=clamp(ft.mid*140,0,100)+'%'; $('mTre').style.width=clamp(ft.tre*160,0,100)+'%';
  $('mCen').style.width=clamp(ft.cen01*100,0,100)+'%';
  $('curbar').textContent=arrangeOn?curBar:'—'; $('cursec').textContent=arrangeOn?curSection:'all on';
  $('beatdot').classList.toggle('on',ft.beat);
  updatePalettePlayhead(); updateArrPlayhead();
  // Sync the seek slider with the transport. silent:true so we don't recurse
  // into seekTo via the onChange handler. setValue snaps + early-returns if
  // unchanged, so per-frame calls cost ~nothing when curBar hasn't advanced.
  if (seekSlider && arrangeOn) seekSlider.setValue(curBar, { silent: true });
  requestAnimationFrame(loop);
}

let currentPalette=[];
function applyAll(){
  try{
    currentPalette=parsePalette($('code').value);
    arr=parseArr($('arr').value); $('len').textContent=arr.length;
    paletteDirty = true; arrDirty = true;
    if(ac){ buildTracks(currentPalette); if(playing && arrangeOn){ stepIndex=0; nextTime=ac.currentTime+0.05; curSection='—'; } }
    // Build displays now so they're visible even before transport starts.
    buildPaletteDisplay(); buildArrangementDisplay();
  }catch(e){ /* studio2 has no #err target; surface to console */ console.error('[studio2]', e.message); }
}

function loadPreset(key){
  const p = PRESETS[key]; if(!p) return;
  currentTrackLabel = p.label;
  $('bpm').value = p.bpm;
  $('code').value = p.palette;
  $('arr').value = p.arrangement;
  applyAll();
  if(ac && ac._dly) ac._dly.delayTime.setTargetAtTime(60/bpm()*0.75, ac.currentTime, 0.05);
  if(ac && masterFilter) masterFilter.frequency.setValueAtTime(20000, ac.currentTime);
  // Reset the seek slider to bar 0 and clear any pending seek from the prior
  // preset. curBar is reset by applyAll → buildTracks → resetArrangement path.
  curBar = 0; seekPending = false; pendingSeekBar = 0;
  if (seekSlider) seekSlider.setValue(0, { silent: true });
}

const presetSel = $('preset');
for(const [k,v] of Object.entries(PRESETS)){
  const o = document.createElement('option');
  o.value = k; o.textContent = v.label;
  presetSel.appendChild(o);
}
const _urlPreset = new URLSearchParams(location.search).get('preset');
const _initialKey = (_urlPreset && PRESETS[_urlPreset]) ? _urlPreset : 'gm-trance';
presetSel.value = _initialKey;
presetSel.addEventListener('change', () => loadPreset(presetSel.value));
loadPreset(_initialKey);

// Seek slider. Created AFTER first loadPreset so `arr` exists for the format
// callback. max=63 spans bar 0..63 (all current presets are @length 64);
// presets with a shorter length wrap naturally via handleBar's modulo.
seekSlider = new BrailleSlider({
  mount: $('seek-mount'),
  min: 0, max: 63, step: 1,
  value: 0, label: 'bar',
  palette: 'teal',
  format: v => `${v}/${arr ? arr.length : 64}`,
});
seekSlider.onChange((v) => seekTo(v));

if (new URLSearchParams(location.search).get('autoplay') === '1') {
  setTimeout(() => { if (!playing) $('play').click(); }, 120);
}

controlChan.onmessage = (e) => {
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'preset' && typeof d.key === 'string' && PRESETS[d.key]) {
    presetSel.value = d.key;
    loadPreset(d.key);
    if (!playing) $('play').click();
    return;
  }
  if (d.type === 'stop') {
    if (playing) $('play').click();
    return;
  }
};

$('play').addEventListener('click',()=>{
  if(!playing){ startTransport(); $('play').textContent='■ stop'; $('play').classList.add('on'); }
  else{ stopTransport(); $('play').textContent='▶ play'; $('play').classList.remove('on'); lastPlayheadKey=''; lastSecKey=''; updatePalettePlayhead(); updateArrPlayhead(); } });
$('vol').addEventListener('input',e=>{ if(master) master.gain.setTargetAtTime(parseFloat(e.target.value),ac.currentTime,0.02); });
$('bpm').addEventListener('change',()=>{ if(ac&&ac._dly) ac._dly.delayTime.setTargetAtTime(60/bpm()*0.75,ac.currentTime,0.05); });
